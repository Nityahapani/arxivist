[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Hu et al. (2021), arXiv:2106.09685"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
hf = ["transformers>=4.40", "datasets>=2.18", "accelerate>=0.30"]

[project.scripts]
lora-repro = "lora_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
