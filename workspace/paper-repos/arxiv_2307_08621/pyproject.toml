[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retnet-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Sun et al. (2023), arXiv:2307.08621"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]


[project.scripts]
retnet-repro = "retnet_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
