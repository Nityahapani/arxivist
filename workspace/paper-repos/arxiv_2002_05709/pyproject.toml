[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simclr-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Chen et al. (2020), arXiv:2002.05709"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
vision = ["torchvision>=0.17"]

[project.scripts]
simclr-repro = "simclr_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
