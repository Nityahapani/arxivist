[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokking-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Power et al. (2022), arXiv:2201.02177"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
grokking-repro = "grokking_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
