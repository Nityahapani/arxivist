[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-rcnn-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of He et al. (2017), arXiv:1703.06870"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
coco = ["torchvision>=0.17", "pycocotools>=2.0"]

[project.scripts]
mask-rcnn-repro = "mask_rcnn_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
