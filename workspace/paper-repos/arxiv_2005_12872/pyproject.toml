[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detr-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Carion et al. (2020), arXiv:2005.12872"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
coco = ["torchvision>=0.17", "pycocotools>=2.0"]

[project.scripts]
detr-repro = "detr_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
