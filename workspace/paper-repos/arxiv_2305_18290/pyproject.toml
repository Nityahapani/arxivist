[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Rafailov et al. (2023), arXiv:2305.18290"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
hf = ["transformers>=4.40", "datasets>=2.18"]

[project.scripts]
dpo-repro = "dpo_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
