[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilenetv3-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Howard et al. (2019), arXiv:1905.02244"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]


[project.scripts]
mobilenetv3-repro = "mobilenetv3_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
