[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashattention-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Dao et al. (2022), arXiv:2205.14135"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
cuda = ["flash-attn>=2.5"]

[project.scripts]
flashattention-repro = "flashattention_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
