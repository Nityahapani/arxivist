[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm-paper-reproduction"
version = "0.1.0"
description = "Independent reproduction of Rombach et al. (2022), arXiv:2112.10752"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
metrics = ["torchvision>=0.17", "lpips>=0.1", "torch-fidelity>=0.3"]

[project.scripts]
ldm-repro = "ldm_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
